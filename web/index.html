<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mail0 — Email Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="layout">
    <nav class="sidebar">
      <div class="logo">
        <div class="logo-icon">M</div>
        Mail0
      </div>

      <div class="nav-section">
        <h2>Navigation</h2>
        <a href="/" class="nav-link active" data-nav>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          Dashboard
        </a>
        <a href="/accounts" class="nav-link" data-nav>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          Accounts
        </a>
        <a href="/import" class="nav-link" data-nav>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          Import
        </a>
      </div>

      <div class="nav-section">
        <h2>Quick Actions</h2>
        <a href="/accounts/add" class="nav-link" data-nav>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
          Add Account
        </a>
      </div>

      <div class="sidebar-footer">
        <div class="version">Mail0 v1.0 · Go/Gin</div>
      </div>
    </nav>

    <main id="app" class="main">
      <div class="loading-state">
        <div class="spinner"></div>
      </div>
    </main>
  </div>
  <script src="/app.js"></script>
</body>
</html>
